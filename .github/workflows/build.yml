name: Buat APK JAX REMOTE DESKTOP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ekstrak ZIP otomatis
        run: |
          ls -la
          sudo apt-get update && sudo apt-get install -y unzip
          # ekstrak semua zip
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Ekstrak $z"
              unzip -o "$z"
              rm "$z"
            fi
          done
          ls -la

      - name: Cari folder project
        run: |
          DIR=$(find . -type f -name "settings.gradle*" | head -1 | xargs dirname)
          if [ -z "$DIR" ]; then
            DIR=$(find . -type f -name "gradlew" | head -1 | xargs dirname)
          fi
          if [ -z "$DIR" ]; then DIR="."; fi
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project ketemu di: $DIR"
          ls -la "$DIR"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Jalankan gradlew dan Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: JACL-REMOTE-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
